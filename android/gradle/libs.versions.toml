[versions]
agp = "8.5.0"
kotlin = "2.0.0"
coreKtx = "1.13.1"
lifecycle = "2.8.3"
activityCompose = "1.9.0"
composeBom = "2024.06.00"
navigationCompose = "2.7.7"
supabase = "3.0.3"
ktor = "3.0.1"
room = "2.6.1"
ksp = "2.0.0-1.0.22"
hilt = "2.51.1"
hiltNavigationCompose = "1.2.0"
workManager = "2.9.0"
coil = "2.7.0"
razorpay = "1.6.40"
googleServices = "4.4.2"
firebaseBom = "33.1.2"
mapsCompose = "4.4.1"
kotlinSerialization = "1.7.1"
coroutines = "1.8.1"

[libraries]
androidx-core-ktx              = { group = "androidx.core",             name = "core-ktx",                        version.ref = "coreKtx" }
androidx-lifecycle-runtime     = { group = "androidx.lifecycle",        name = "lifecycle-runtime-ktx",            version.ref = "lifecycle" }
androidx-lifecycle-viewmodel   = { group = "androidx.lifecycle",        name = "lifecycle-viewmodel-compose",      version.ref = "lifecycle" }
androidx-activity-compose      = { group = "androidx.activity",         name = "activity-compose",                 version.ref = "activityCompose" }
compose-bom                    = { group = "androidx.compose",          name = "compose-bom",                      version.ref = "composeBom" }
compose-ui                     = { group = "androidx.compose.ui",       name = "ui" }
compose-ui-graphics            = { group = "androidx.compose.ui",       name = "ui-graphics" }
compose-ui-tooling-preview     = { group = "androidx.compose.ui",       name = "ui-tooling-preview" }
compose-material3              = { group = "androidx.compose.material3", name = "material3" }
compose-material-icons         = { group = "androidx.compose.material", name = "material-icons-extended" }
compose-ui-tooling             = { group = "androidx.compose.ui",       name = "ui-tooling" }
navigation-compose             = { group = "androidx.navigation",        name = "navigation-compose",               version.ref = "navigationCompose" }

# Supabase Kotlin SDK
supabase-bom                   = { group = "io.github.jan-tennert.supabase", name = "bom", version.ref = "supabase" }
supabase-postgrest             = { group = "io.github.jan-tennert.supabase", name = "postgrest-kt" }
supabase-auth                  = { group = "io.github.jan-tennert.supabase", name = "auth-kt" }
supabase-realtime              = { group = "io.github.jan-tennert.supabase", name = "realtime-kt" }
supabase-storage               = { group = "io.github.jan-tennert.supabase", name = "storage-kt" }
supabase-functions             = { group = "io.github.jan-tennert.supabase", name = "functions-kt" }
supabase-compose-auth          = { group = "io.github.jan-tennert.supabase", name = "compose-auth" }
supabase-compose-auth-ui       = { group = "io.github.jan-tennert.supabase", name = "compose-auth-ui" }
ktor-client-android            = { group = "io.ktor",                    name = "ktor-client-android",              version.ref = "ktor" }
ktor-client-core               = { group = "io.ktor",                    name = "ktor-client-core",                 version.ref = "ktor" }

# Room
room-runtime                   = { group = "androidx.room",              name = "room-runtime",                     version.ref = "room" }
room-ktx                       = { group = "androidx.room",              name = "room-ktx",                         version.ref = "room" }
room-compiler                  = { group = "androidx.room",              name = "room-compiler",                    version.ref = "room" }

# Hilt DI
hilt-android                   = { group = "com.google.dagger",          name = "hilt-android",                     version.ref = "hilt" }
hilt-compiler                  = { group = "com.google.dagger",          name = "hilt-android-compiler",            version.ref = "hilt" }
hilt-navigation-compose        = { group = "androidx.hilt",              name = "hilt-navigation-compose",          version.ref = "hiltNavigationCompose" }

# WorkManager
work-runtime-ktx               = { group = "androidx.work",              name = "work-runtime-ktx",                 version.ref = "workManager" }
hilt-work                      = { group = "androidx.hilt",              name = "hilt-work",                        version.ref = "hiltNavigationCompose" }

# Image loading
coil-compose                   = { group = "io.coil-kt",                 name = "coil-compose",                     version.ref = "coil" }

# Payments
razorpay-checkout              = { group = "com.razorpay",               name = "checkout",                         version.ref = "razorpay" }

# Firebase
firebase-bom                   = { group = "com.google.firebase",        name = "firebase-bom",                     version.ref = "firebaseBom" }
firebase-messaging             = { group = "com.google.firebase",        name = "firebase-messaging-ktx" }
firebase-analytics             = { group = "com.google.firebase",        name = "firebase-analytics-ktx" }

# Maps
maps-compose                   = { group = "com.google.maps.android",    name = "maps-compose",                     version.ref = "mapsCompose" }

# Serialization
kotlinx-serialization-json     = { group = "org.jetbrains.kotlinx",     name = "kotlinx-serialization-json",       version.ref = "kotlinSerialization" }
kotlinx-coroutines-android     = { group = "org.jetbrains.kotlinx",     name = "kotlinx-coroutines-android",       version.ref = "coroutines" }

[plugins]
android-application            = { id = "com.android.application",       version.ref = "agp" }
kotlin-android                 = { id = "org.jetbrains.kotlin.android",  version.ref = "kotlin" }
kotlin-compose                 = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization           = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
google-services                = { id = "com.google.gms.google-services", version.ref = "googleServices" }
ksp                            = { id = "com.google.devtools.ksp",        version.ref = "ksp" }
hilt                           = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
