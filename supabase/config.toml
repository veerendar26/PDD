project_id = "ecofix"

[api]
enabled   = true
port      = 54321
schemas   = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows  = 1000

[db]
port     = 54322
shadow_port = 54320
major_version = 15

[studio]
enabled = true
port    = 54323
api_url = "http://127.0.0.1"

[inbucket]
enabled  = true
port     = 54324
smtp_port = 54325
pop3_port = 54326

[storage]
enabled = true
file_size_limit = "50MiB"

[storage.buckets.repair-media]
public              = true
file_size_limit     = "20MiB"
allowed_mime_types  = ["image/png", "image/jpeg", "image/webp", "video/mp4", "video/quicktime"]

[auth]
enabled            = true
site_url           = "http://localhost:3000"
jwt_expiry         = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval  = 10

[auth.email]
enable_signup     = true
enable_confirmations = true
double_confirm_changes = true
secure_password_change = true
otp_expiry = 3600

[auth.email.smtp]
host = "smtp-relay.brevo.com"
port = 587
user = "veerendarnani5656@gmail.com"
pass = "env(SMTP_PASS)"
admin_email = "veerendarnani5656@gmail.com"
sender_name = "EcoFix Support"

[auth.email.template.confirmation]
subject = "Confirm your EcoFix registration"
content_path = "./templates/confirmation.html"

[auth.sms]
enable_signup     = false

[realtime]
enabled = true
ip_version = "IPv4"
max_header_length = 4096

[edge_runtime]
enabled    = true
policy     = "per_worker"
inspector_port = 8083

[analytics]
enabled   = false
port      = 54327
backend   = "postgres"

[functions.notify-status-change]
verify_jwt = true

[functions.payment-webhook]
verify_jwt = false

[functions.ai-diagnosis]
verify_jwt = true
